[project]
name = "KatzPlotkinPy"
version = "0.1.0"
description = "Unofficial companion to Low Speed Aerodynamics (2nd Ed)"
license = "MIT"
authors = [{ name = "alwinw", email = "16846521+alwinw@users.noreply.github.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1",
]

[project.urls]
Homepage = "https://github.com/alwinw/KatzPlotkinPy"
Repository = "https://github.com/alwinw/KatzPlotkinPy"
Documentation = "https://github.com/alwinw/KatzPlotkinPy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katzplotkinpy"]

[dependency-groups]
dev-tools = [
  "mypy>=1.12.0",
  "ruff>=0.6.3",
  "pytest>=9.0.3",
  "pytest-cov>=5.0.0",
  "tox>=4.18.0",
]
dev-interactive = [
  "ipython>=8.27.0",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.5",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = false
changelog_incremental = true
use_shortcuts = true
version_files = ['src/katzplotkinpy/__version__.py']

[tool.pytest.ini_options]
addopts = [
  "-v",                              # Increase verbosity
  "-ra",                             # Extra test summary
  "--ff",                            # Run failed tests first
  "--showlocals",                    # Locals in tracebacks
  "--strict-markers",                # Unknown markers raise errors
  "--strict-config",                 # Unknown config options raise errors
  "--cov=katzplotkinpy",             # Measure coverage of package
  "--cov-report=term-missing",       # Show missing lines in terminal
  "--cov-fail-under=0",              # Fail if coverage is less than MIN
]
minversion = "8.0"
testpaths = ["tests"]
